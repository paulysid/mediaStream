name: Build playlist

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'streams/**'
      - '.github/workflows/build-playlist.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build English playlist
        run: python scripts/build_playlist.py

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.m3u
          git diff --cached --quiet || git commit -m "Build combined stream playlist"
          git push
