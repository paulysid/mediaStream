name: Build playlist

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'streams/**'
      - '.github/workflows/build-playlist.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build index playlist
        shell: bash
        run: |
          {
            echo '#EXTM3U'
            find streams -type f -name '*.m3u' -print0 \
              | sort -z \
              | xargs -0 awk 'FNR > 1'
          } > index.m3u

      - name: Commit playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.m3u
          git diff --cached --quiet || git commit -m "Build combined stream playlist"
          git push
